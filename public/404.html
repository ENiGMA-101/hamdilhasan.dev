      :root {
        --navy: #0b1220;
        --ink: #111827;
        --blue: #2563eb;
        --teal: #14b8a6;
        --mist: #f7f8fa;
        --line: #1e293b;
        --muted: #94a3b8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--navy);
        color: #f8fafc;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .grid-bg {
        position: fixed;
        inset: 0;
        background-size: 44px 44px;
        background-image:
          linear-gradient(to right, rgba(148, 163, 184, 0.07) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(148, 163, 184, 0.07) 1px, transparent 1px);
        mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 78%);
        -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 78%);
        pointer-events: none;
      }
      .card { position: relative; max-width: 30rem; }
      .mono {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.7rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        font-size: clamp(2rem, 8vw, 3rem);
        line-height: 1.05;
        letter-spacing: -0.03em;
        margin: 1rem 0 0.75rem;
        font-weight: 700;
      }
      h1 span {
        background: linear-gradient(100deg, var(--blue), var(--teal));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { color: #cbd5e1; line-height: 1.65; margin: 0 0 2rem; }
      .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      a:hover { transform: translateY(-1px); }
      a.primary { background: var(--blue); color: #fff; }
      a.ghost { border: 1px solid var(--line); color: #cbd5e1; }
      .mark { display: flex; justify-content: center; margin-bottom: 1.75rem; }
